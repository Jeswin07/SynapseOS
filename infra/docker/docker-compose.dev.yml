services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile

    image: synapseos-backend:dev

    env_file:
      - ../../backend/.env.docker

    environment:
      ENVIRONMENT: development

    volumes:
      - ../../backend/src:/app/src
      - ../../backend/alembic:/app/alembic

    ports:
      - "8000:8000"

    networks:
      - synapseos-network

    command: >
      uvicorn
      src.main:app
      --host 0.0.0.0
      --port 8000
      --reload

networks:
  synapseos-network:
    external: true
    name: docker_synapseos-network